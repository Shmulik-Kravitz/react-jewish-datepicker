name: CI_CD

on: [push, pull_request]

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'yarn'

    - name: Install
      run: yarn

    - name: Build
      run: yarn build

    - name: Test
      run: yarn test

    # - name: Code Coverage Report
    #   uses: irongut/CodeCoverageSummary@v1.3.0
    #   with:
    #     filename: coverage/**/cobertura-coverage.xml
    #     badge: true
    #     fail_below_min: true
    #     format: markdown
    #     hide_branch_rate: false
    #     hide_complexity: true
    #     indicators: true
    #     output: both
    #     thresholds: '60 80'

    # - name: Add Coverage PR Comment
    #   uses: marocchino/sticky-pull-request-comment@v3
    #   if: github.event_name == 'pull_request'
    #   with:
    #     recreate: true
    #     path: code-coverage-results.md

    - name: Upload build artifact lib_core
      uses: actions/upload-artifact@v7
      with:
       name: lib_core
       path: packages/jewishDatesCore/lib

    - name: Upload build artifact dist_core
      uses: actions/upload-artifact@v7
      with:
        name: dist_core
        path: packages/jewishDatesCore/dist

    - name: Upload build artifact lib_picker
      uses: actions/upload-artifact@v7
      with:
       name: lib_picker
       path: packages/reactJewishDatePicker/lib

    - name: Upload build artifact dist_picker
      uses: actions/upload-artifact@v7
      with:
        name: dist_picker
        path: packages/reactJewishDatePicker/dist

  release:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: write
      deployments: write
      id-token: write
    needs: [build-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install
        run: yarn

      - name: Download build artifact lib_core
        uses: actions/download-artifact@v8
        with:
          name: lib_core
          path: packages/jewishDatesCore/lib

      - name: Download build artifact dist_core
        uses: actions/download-artifact@v8
        with:
          name: dist_core
          path: packages/jewishDatesCore/dist

      - name: Download build artifact lib_picker
        uses: actions/download-artifact@v8
        with:
          name: lib_picker
          path: packages/reactJewishDatePicker/lib

      - name: Download build artifact dist_picker
        uses: actions/download-artifact@v8
        with:
          name: dist_picker
          path: packages/reactJewishDatePicker/dist


      - name: Resolve release version
        run: |
          set -euo pipefail

          # Fetch each package's full version list up front. `npm view pkg@ver`
          # exits non-zero both for a version that isn't published and for a
          # lookup that failed (network, registry, rate limit), so asking it the
          # per-version question turns every hiccup into "not published yet" and
          # then tries to republish a live version. Here a failed lookup fails
          # the job instead of quietly corrupting the decision.
          CORE_VERSIONS=$(npm view jewish-dates-core versions --json)
          PICKER_VERSIONS=$(npm view react-jewish-datepicker versions --json)

          # A version counts as taken if *either* package already has it, so a
          # run that published core and then died doesn't leave the picker
          # pinned to a number it can never publish. (npm returns a bare string
          # rather than an array when a package has exactly one version.)
          is_taken() {
            node -e '
              const [version, ...lists] = process.argv.slice(1);
              const published = lists.flatMap((list) => [].concat(JSON.parse(list)));
              process.exit(published.includes(version) ? 0 : 1);
            ' "$1" "$CORE_VERSIONS" "$PICKER_VERSIONS"
          }

          # Release the committed version when it hasn't been published yet, so a
          # deliberate major/minor bump lands as written (a patch bump could never
          # produce x.0.0). Otherwise patch-bump, which is the routine case --
          # in a loop, because a half-finished earlier release can have burned
          # more than one number.
          VERSION=$(yarn get-version | tr -d '[:space:]')
          for _ in $(seq 20); do
            if ! is_taken "$VERSION"; then
              break
            fi
            echo "$VERSION is already on npm; patch-bumping"
            yarn inc-version
            VERSION=$(yarn get-version | tr -d '[:space:]')
          done

          if is_taken "$VERSION"; then
            echo "Gave up looking for an unpublished version; stopped at $VERSION" >&2
            exit 1
          fi

          echo "Releasing $VERSION"
          echo "VERSION_TAG=$VERSION" >> $GITHUB_ENV

      # Trusted publishing (OIDC) needs npm >= 11.5.1; don't rely on whichever
      # npm happens to ship with the Node release.
      - name: Update npm
        run: npm install -g npm@latest

      # yarn pack resolves the workspace:* ranges to real versions in the
      # packed manifest, then npm publishes that tarball -- npm is used for the
      # upload because only the npm CLI supports OIDC trusted publishing.
      - name: Pack jewish-dates-core
        working-directory: packages/jewishDatesCore/
        run: yarn pack

      - name: Pack react-jewish-datepicker
        working-directory: packages/reactJewishDatePicker/
        run: yarn pack

      - name: Publish jewish-dates-core
        working-directory: packages/jewishDatesCore/
        run: npm publish package.tgz --access public --provenance

      - name: Publish react-jewish-datepicker
        working-directory: packages/reactJewishDatePicker/
        run: npm publish package.tgz --access public --provenance

      # Commit and tag only after publishing succeeds, so a failed run doesn't
      # burn a version number or leave a tag for a release that isn't on npm.
      # The tag must also come after the commit, otherwise it points at the
      # parent commit and labels the previous version's tree.
      - name: Commit and tag version
        run: |
          git config --global user.name 'Shmulik-Kravitz'
          git config --global user.email '29735690+Shmulik-Kravitz@users.noreply.github.com'
          # No bump happened when the committed version was released as-is,
          # and 'git commit' fails on an empty index.
          if git diff --quiet; then
            echo "Version already committed; tagging only"
          else
            git commit -am v$VERSION_TAG
            git push
          fi
          git tag v$VERSION_TAG
          git push origin v$VERSION_TAG
