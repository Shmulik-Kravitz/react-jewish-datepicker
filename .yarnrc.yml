compressionLevel: mixed

enableColors: false

enableGlobalCache: false

logFilters:
  - code: YN0002
    level: discard
  - code: YN0076
    level: discard

nodeLinker: pnp

# Exempt from npmMinimalAgeGate (24h by default), so a jewish-holidays release
# can be picked up the day it is published. Same author as this repo; the gate
# stays in force for every other package.
npmPreapprovedPackages:
  - jewish-holidays

npmPublishAccess: public

# npmRegistryServer (registry.yarnpkg.com) is a read-only mirror and rejects
# PUT with 404, so publishing must be pointed at the npm registry itself.
npmPublishRegistry: "https://registry.npmjs.org"

packageExtensions:
  debug@*:
    dependencies:
      supports-color: "*"
  vite@*:
    dependencies:
      ms: "*"
      supports-color: "*"

pnpFallbackMode: all

pnpMode: loose

yarnPath: .yarn/releases/yarn-4.17.1.cjs
